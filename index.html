<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Air Quality Assistant</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#eef4ff;padding:16px}
.card{max-width:480px;margin:20px auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
h1{font-size:22px;margin:0}
p.sub{color:#666;margin:10px 0 18px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;outline:none}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:17px;font-weight:bold}
#result{margin-top:14px;background:#f1f5f9;padding:14px;border-radius:12px;min-height:60px;line-height:1.6}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;color:#fff;font-weight:bold;font-size:13px}
small{color:#777}
</style>
</head>
<body>
<div class="card">
<h1>🌥️ Urban Air Quality Assistant</h1>
<p class="sub">Check live AQI of any city in India</p>
<input id="city" value="Bhubaneswar" placeholder="Enter city - e.g. Delhi">
<button onclick="checkAQI()">Check Air Quality</button>
<div id="result">Enter a city and tap Check.</div>
<p><small>Data: Open-Meteo Air Quality API • Free, no login</small></p>
</div>
<script>
async function checkAQI(){
  const city = document.getElementById('city').value.trim();
  const box = document.getElementById('result');
  if(!city){ box.innerHTML='Please enter a city name.'; return; }
  box.innerHTML='Loading... Please wait...';
  try{
    const geoRes = await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=en&format=json');
    const geo = await geoRes.json();
    if(!geo.results || !geo.results.length){ box.innerHTML='City not found. Try Delhi, Mumbai, Bhubaneswar.'; return; }
    const place = geo.results[0];
    const aqRes = await fetch('https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+place.latitude+'&longitude='+place.longitude+'&current=pm2_5,pm10,us_aqi,ozone,nitrogen_dioxide&domains=auto');
    const aq = await aqRes.json();
    const c = aq.current;
    const aqi = c.us_aqi;
    let label='Good', color='#22c55e';
    if(aqi>300){label='Hazardous';color='#7e22ce'}
    else if(aqi>200){label='Very Unhealthy';color='#dc2626'}
    else if(aqi>150){label='Unhealthy';color='#ea580c'}
    else if(aqi>100){label='Unhealthy for Sensitive Groups';color='#f59e0b'}
    else if(aqi>50){label='Moderate';color='#eab308'}
    box.innerHTML='<b>'+place.name+', '+(place.admin1||'')+'</b><br><span style="font-size:32px;font-weight:bold">'+aqi+'</span> US AQI <span class="badge" style="background:'+color+'">'+label+'</span><br>PM2.5: '+c.pm2_5+' µg/m³<br>PM10: '+c.pm10+' µg/m³<br>Ozone: '+c.ozone+' µg/m³<br>NO2: '+c.nitrogen_dioxide+' µg/m³<br><small>Updated: '+c.time+'</small>';
  }catch(e){
    box.innerHTML='Error. Check internet and try again. <br><small>'+e.message+'</small>';
  }
}
checkAQI();
</script>
</body>
</html>
